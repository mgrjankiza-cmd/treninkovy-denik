<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1efe9">
<meta name="description" content="Osobní tréninkový deník do posilovny.">
<link rel="manifest" href="manifest.webmanifest">
<title>Tréninkový deník</title>
<style>
:root{color-scheme:light dark;--bg:#f1efe9;--card:#fff;--ink:#202124;--muted:#77766f;--line:#e5e1d8;--accent:#e8a200;--accent2:#ffc83d;--green:#21864b;--greenbg:#e2f4e8;--shadow:0 3px 14px #0000000d;--nav:rgba(255,255,255,.94);--field:#f7f6f2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1113;--card:#1a1d21;--ink:#f2f2ef;--muted:#a5a7aa;--line:#30343a;--accent:#ffc83d;--accent2:#e8a200;--green:#65d58d;--greenbg:#173b27;--shadow:0 3px 16px #0005;--nav:rgba(26,29,33,.96);--field:#25292e}}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 0 calc(82px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;min-height:44px;border-radius:13px;padding:9px 13px;background:var(--field);color:var(--ink);font-weight:700}button:active{transform:scale(.98)}button.primary{background:var(--accent);color:#191919}button.danger{color:#c53d35}input,select,textarea{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px;min-height:42px;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}.app{max-width:650px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 15px 24px}.screen{display:none}.screen.active{display:block}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{font-size:29px;line-height:1.12;margin:5px 0 4px;font-weight:900;letter-spacing:-.7px}h2{font-size:19px;margin:22px 0 11px}h3{font-size:16px;margin:0}.date{color:var(--muted);font-size:14px}.card{background:var(--card);border-radius:19px;padding:15px;margin:13px 0;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 65%,transparent)}.daybtn{width:100%;min-height:74px;text-align:left;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;margin:9px 0;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.daybtn strong{font-size:17px}.daybtn small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.daybtn.next{border:2px solid var(--accent)}.pill{display:inline-flex;align-items:center;background:var(--field);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:800;color:var(--muted)}.pill.gold{background:var(--accent);color:#171717}.weightbox{display:flex;align-items:center;gap:8px}.weightbox input{width:100%;text-align:center;font-size:25px;font-weight:900;padding:8px}.weightbox button{width:46px;font-size:21px}.muted{color:var(--muted)}.small{font-size:12px}.checkline{display:flex;align-items:center;gap:9px;min-height:44px}.checkline input{width:20px;height:20px;accent-color:var(--accent)}.section-head{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 9px}.section-head h2{margin:0}.exercise-card{background:var(--card);border:1px solid var(--line);border-radius:17px;margin:9px 0;overflow:hidden;box-shadow:var(--shadow)}.exercise-head{display:flex;align-items:center;gap:8px;padding:12px;min-height:58px}.exercise-title{flex:1;min-width:0;font-weight:850}.exercise-title small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exercise-summary{font-size:12px;color:var(--muted);white-space:nowrap}.exercise-body{padding:0 10px 12px}.setrow{display:grid;grid-template-columns:21px minmax(0,1fr) minmax(0,1fr) 40px 40px;gap:5px;align-items:center;margin:7px 0}.setnum{font-size:12px;color:var(--muted);text-align:center}.stepper{display:flex;align-items:center;gap:2px;min-width:0}.stepper button{min-height:36px;width:29px;padding:0;font-size:16px;border-radius:9px}.stepper input{width:100%;min-width:0;height:36px;min-height:36px;text-align:center;padding:3px;font-size:14px;font-weight:800}.donebtn,.delbtn{min-height:38px;padding:0;font-size:17px}.donebtn{background:var(--field)}.donebtn.checked{background:var(--greenbg);color:var(--green)}.delbtn{background:transparent;color:var(--muted)}.setrow.completed{background:var(--greenbg);border-radius:10px;padding:3px 2px}.side-label{font-size:11px;color:var(--muted);font-weight:800}.side-row{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(0,1fr);gap:5px;align-items:center;margin:5px 0}.side-row .stepper input{height:33px;min-height:33px}.side-row .stepper button{height:33px;min-height:33px;width:25px}.addseries{width:100%;margin-top:7px;background:transparent;border:1px dashed var(--line);color:var(--muted)}.exercise-chip{display:inline-flex;margin:4px 4px 4px 0;padding:9px 12px;min-height:40px;border-radius:99px;background:var(--field);font-size:13px;font-weight:700}.other-list{margin:7px 0}.custom-add{display:flex;gap:7px;margin-top:12px}.custom-add input{flex:1}.bottomnav{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--nav);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);max-width:650px;margin:auto}.navbtn{background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:3px;font-size:11px;color:var(--muted)}.navicon{font-size:20px;line-height:25px;width:42px;border-radius:99px}.navbtn.active{color:var(--ink)}.navbtn.active .navicon{background:var(--accent);color:#171717}.timerbar{position:fixed;z-index:19;bottom:calc(70px + env(safe-area-inset-bottom));left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px;display:none;box-shadow:0 -4px 16px #0001}.timerbar.show{display:block}.timerbar.ring{background:var(--greenbg)}.timer-inner{max-width:620px;margin:auto;display:flex;align-items:center;gap:8px}.clock{flex:1;min-width:0}.clock strong{font-size:18px}.clock small{display:block;color:var(--muted);font-size:10px}.timer-actions{display:flex;gap:4px}.timer-actions button{min-height:39px;padding:5px 9px;font-size:12px}.timer-actions .pause{background:var(--accent);color:#171717}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1}.fieldlabel{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:9px 0 5px}.history-item{padding:14px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border:0}.history-head{display:flex;justify-content:space-between;gap:10px}.history-head strong{font-size:15px}.history-ex{font-size:13px;margin:9px 0 0 10px}.history-ex b{display:block;margin-bottom:3px}.manage-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:4px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.manage-row input{width:100%;padding:8px}.manage-row button{min-width:39px;padding:5px}.manage-part{margin:18px 0}.chartbox{background:var(--card);border-radius:18px;padding:13px;margin-top:13px}.chartbox svg{width:100%;height:auto;display:block;overflow:visible}.chart-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.empty{padding:24px 10px;text-align:center;color:var(--muted)}.notice{padding:10px 12px;background:var(--field);border-radius:12px;font-size:12px;color:var(--muted);margin:10px 0}.toast{position:fixed;z-index:40;bottom:calc(145px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;font-size:13px;display:none;max-width:90%;text-align:center}.toast.show{display:block}.hidden{display:none!important}textarea{width:100%;min-height:130px;font-family:ui-monospace,monospace;font-size:12px}.subhead{font-size:13px;color:var(--muted);margin:4px 0 10px}.full{width:100%}
@media(min-width:600px){.app{padding-left:22px;padding-right:22px}.setrow{grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 46px 46px}}
</style>
</head>
<body>
<main class="app">
<section id="screen-training" class="screen active">
<div id="homeView">
<div class="topline"><div><div class="eyebrow">Tréninkový deník</div><h1>Co dnes cvičíme?</h1><div id="todayDate" class="date"></div></div><span class="pill">POSILOVNA</span></div>
<div class="card"><div class="section-head" style="margin:0 0 10px"><h3>Tělesná váha</h3><span class="muted small">kg</span></div><div class="weightbox"><button id="weightMinus" aria-label="Snížit váhu">−</button><input id="homeWeight" type="number" step="0.1" inputmode="decimal" aria-label="Tělesná váha"><button id="weightPlus" aria-label="Zvýšit váhu">+</button></div><div class="small muted" id="weightDate"></div></div>
<div id="dayButtons"></div>
<label class="checkline"><input type="checkbox" id="addAbs"> Přidat břicho <span id="absLast" class="muted small"></span></label><div class="card"><div class="topline"><strong>Výchozí délka pauzy</strong><select id="pauseLength" aria-label="Délka pauzy"><option value="60">60 sekund</option><option value="90">90 sekund</option><option value="120">120 sekund</option><option value="150">150 sekund</option><option value="180">180 sekund</option></select></div></div>
</div>
<div id="workoutView" class="hidden">
<div class="topline"><div><div class="eyebrow" id="workoutDay"></div><h1>Trénink</h1><div class="date" id="workoutStarted"></div></div><button id="endWorkout" class="danger">Ukončit</button></div>
<div id="workoutContent"></div>
</div>
</section>
<section id="screen-progress" class="screen"><div class="eyebrow">Výsledky</div><h1>Progres</h1><label class="fieldlabel" for="progressSelect">Co chceš sledovat?</label><select id="progressSelect" class="full"></select><div id="progressOutput"></div></section>
<section id="screen-history" class="screen"><div class="eyebrow">Záznamy</div><h1>Historie</h1><div id="historyList"></div></section>
<section id="screen-exercises" class="screen"><div class="eyebrow">Nastavení</div><h1>Cviky a záloha</h1><div id="exerciseManager"></div><h2>Záloha dat</h2><div class="notice">Exportuj si data pravidelně. Záloha obsahuje cviky, historii, tělesnou váhu i rozpracovaný trénink.</div><textarea id="backupText" placeholder="Zde se zobrazí JSON záloha nebo vlož JSON pro import…"></textarea><div class="toolbar"><button id="exportBtn" class="primary">Export</button><button id="importBtn">Import</button></div></section>
</main>
<div id="timerBar" class="timerbar"><div class="timer-inner"><div class="clock"><strong id="totalClock">00:00</strong><small>CELKOVÝ ČAS · PAUZA <span id="pauseClock">—</span></small></div><div class="timer-actions"><button id="pauseToggle" class="pause">Pauza</button><button id="pauseMinus">−15</button><button id="pausePlus">+15</button></div></div></div>
<nav class="bottomnav" aria-label="Hlavní navigace">
<button class="navbtn active" data-screen="training"><span class="navicon">🏋</span>Trénink</button>
<button class="navbtn" data-screen="progress"><span class="navicon">↗</span>Progres</button>
<button class="navbtn" data-screen="history"><span class="navicon">▤</span>Historie</button>
<button class="navbtn" data-screen="exercises"><span class="navicon">☷</span>Cviky</button>
</nav>
<div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const STORAGE_KEY='treninkovyDenik_v1';
const PARTS=[
{name:'Nohy',ex:['Leg press','Předkopy','Zákopy','Lýtka v sedě','Lýtka na leg pressu']},
{name:'Ramena',ex:['Tlaky na multipresu','Tlaky na stroji','Přítahy k bradě na multipresu','Zapažování v předklonu','Boční ramena na kladce jednoruč']},
{name:'Záda',ex:['Stahování kladky','Přitahování ke kladce','Přítahy v předklonu','Přítahy v sedě','Zapažování na stroji']},
{name:'Triceps',ex:['Bench press úzkým úchopem','Stahování pevné kladky','Stahování lan','Tricepsové extenze','Tricepsové tlaky v sedě']},
{name:'Hrudník',ex:['Bench press','Tlaky s jednoručkami','Tlaky na multipresu','Protisměrné kladky','Tlaky na peck decku','Rozpažky']},
{name:'Biceps',ex:['Skotova lavice','Kladivové zdvihy','Biceps na kladce']},
{name:'Břicho',ex:['Zkracovačky']}
];
const DAYS=[{name:'Nohy + ramena',parts:['Nohy','Ramena']},{name:'Záda + triceps',parts:['Záda','Triceps']},{name:'Hrudník + biceps',parts:['Hrudník','Biceps']}];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=(s,opts={weekday:'long',day:'numeric',month:'long',year:'numeric'})=>new Intl.DateTimeFormat('cs-CZ',opts).format(new Date(s+'T12:00:00'));
const fmtTime=s=>new Date(s).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
function seed(){let exercises=[];PARTS.forEach(p=>p.ex.forEach((name,i)=>exercises.push({id:uid(),part:p.name,name,order:i,hidden:false,unilateral:name==='Boční ramena na kladce jednoruč'})));return {version:1,exercises,history:[],weights:[],settings:{pause:90,lastWeights:{}},draft:null,bodyWeight:97.5};}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return seed();const x=JSON.parse(raw);if(!x||x.version!==1||!Array.isArray(x.exercises)||!Array.isArray(x.history))return seed();return x;}catch(e){return seed();}}
let db=load(),wakeLock=null,pauseEnd=0,pauseRemaining=0,pauseInterval=null,ringing=false,confirmTimers={};
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}catch(e){toast('Uložení se nezdařilo – v zařízení může být nedostatek místa.');}}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function allPart(p){return db.exercises.filter(e=>e.part===p).sort((a,b)=>a.order-b.order);}
function visiblePart(p){return allPart(p).filter(e=>!e.hidden);}
function getExercise(id){return db.exercises.find(e=>e.id===id);}
function lastFor(id){for(const h of [...db.history].reverse()){const ex=h.exercises.find(x=>x.id===id);if(ex&&ex.sets.length)return ex;}return null;}
function lastWeight(id){return db.settings.lastWeights[id];}
function defaultSet(id){const old=lastFor(id);const w=lastWeight(id);return {kg:w!==undefined?w:(old?.sets?.at(-1)?.kg??0),reps:old?.sets?.at(-1)?.reps??10,done:false};}
function workoutVolume(ex){return ex.sets.reduce((s,x)=>s+(x.done?(x.kg*x.reps*(ex.unilateral?2:1)):0),0);}
function partVolume(part){return (db.draft?.exercises||[]).filter(x=>x.part===part).reduce((s,x)=>s+workoutVolume(x),0);}
function lastAbsDate(){for(const h of [...db.history].reverse())if(h.exercises.some(e=>e.part==='Břicho'&&e.sets.length))return h.date;return null;}
function showScreen(name){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id==='screen-'+name));document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));if(name==='progress')renderProgress();if(name==='history')renderHistory();if(name==='exercises')renderManager();}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>showScreen(b.dataset.screen)));
function renderHome(){document.getElementById('pauseLength').value=String(db.settings.pause||90);document.getElementById('todayDate').textContent=fmtDate(today());document.getElementById('homeWeight').value=db.bodyWeight??97.5;const last=db.weights.at(-1);document.getElementById('weightDate').textContent=last?'Poslední záznam: '+fmtDate(last.date,{day:'numeric',month:'long',year:'numeric'}):'Výchozí hodnota';const lastDay=db.history.at(-1)?.day;const next=(DAYS.findIndex(d=>d.name===lastDay)+1+3)%3;document.getElementById('dayButtons').innerHTML=DAYS.map((d,i)=>`<button class="daybtn ${i===next?'next':''}" data-day="${i}"><span><strong>${esc(d.name)}</strong><small>${d.parts.join(' · ')}</small></span>${i===next?'<span class="pill gold">další na řadě</span>':'<span class="muted">›</span>'}</button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>startWorkout(Number(b.dataset.day)));const a=lastAbsDate();document.getElementById('absLast').textContent=a?'· naposledy '+fmtDate(a,{day:'numeric',month:'short',year:'numeric'}):'· zatím bez záznamu';}
function recordWeight(v){const n=num(v);if(n<=0||n>500)return;db.bodyWeight=n;const d=today(),last=db.weights.at(-1);if(last?.date===d)last.kg=n;else db.weights.push({date:d,kg:n});save();}
document.getElementById('pauseLength').onchange=e=>{db.settings.pause=Number(e.target.value);save();};
document.getElementById('weightMinus').onclick=()=>{const el=document.getElementById('homeWeight');el.value=(num(el.value)-.5).toFixed(1);recordWeight(el.value)};
document.getElementById('weightPlus').onclick=()=>{const el=document.getElementById('homeWeight');el.value=(num(el.value)+.5).toFixed(1);recordWeight(el.value)};
document.getElementById('homeWeight').addEventListener('change',e=>recordWeight(e.target.value));
function startWorkout(dayIndex){if(db.draft){toast('Nejdřív dokonči rozpracovaný trénink.');return;}const d=DAYS[dayIndex];db.draft={id:uid(),day:d.name,parts:document.getElementById('addAbs').checked?[...d.parts,'Břicho']:[...d.parts],date:today(),started:new Date().toISOString(),exercises:[],expanded:null,addAbs:document.getElementById('addAbs').checked};if(db.draft.addAbs)addExercise(db.exercises.find(e=>e.part==='Břicho'&&!e.hidden)?.id);save();acquireWakeLock();renderWorkout();}
function addExercise(id){const e=getExercise(id);if(!e||e.hidden||!db.draft)return;if(db.draft.exercises.some(x=>x.id===id)){db.draft.expanded=id;return;}const old=lastFor(id);const sets=Array.from({length:4},()=>defaultSet(id));db.draft.exercises.push({id,part:e.part,name:e.name,unilateral:!!e.unilateral,sets});db.draft.expanded=id;save();renderWorkout();}
function customExercise(part,name){name=name.trim();if(!name)return;let e=db.exercises.find(x=>x.part===part&&x.name.toLowerCase()===name.toLowerCase());if(!e){e={id:uid(),part,name,order:allPart(part).length,hidden:false,unilateral:false};db.exercises.push(e);save();}addExercise(e.id);}
function renderWorkout(){if(!db.draft){document.getElementById('homeView').classList.remove('hidden');document.getElementById('workoutView').classList.add('hidden');document.getElementById('timerBar').classList.remove('show');renderHome();return;}document.getElementById('homeView').classList.add('hidden');document.getElementById('workoutView').classList.remove('hidden');document.getElementById('timerBar').classList.add('show');document.getElementById('workoutDay').textContent=db.draft.day;document.getElementById('workoutStarted').textContent='Začátek '+fmtTime(db.draft.started);renderWorkoutContent();updateClocks();}
function renderWorkoutContent(){const d=db.draft;if(!d)return;let html='';d.parts.forEach(part=>{const added=d.exercises.filter(x=>x.part===part);html+=`<div class="section-head"><h2>${esc(part)}</h2><span class="pill gold">${Math.round(partVolume(part)).toLocaleString('cs-CZ')} kg</span></div>`;added.forEach(ex=>{const expanded=d.expanded===ex.id;const done=ex.sets.filter(s=>s.done).length;const vol=workoutVolume(ex);const prev=lastFor(ex.id);const prevText=prev?prev.sets.map(s=>s.kg+'×'+s.reps).join(' · '):'bez předchozího záznamu';html+=`<article class="exercise-card"><div class="exercise-head" data-expand="${ex.id}"><div class="exercise-title">${esc(ex.name)}<small>minule: ${esc(prevText)}</small></div><span class="exercise-summary">${done}/${ex.sets.length} sérií · ${Math.round(vol).toLocaleString('cs-CZ')} kg</span><span>${expanded?'⌃':'⌄'}</span></div>`;if(expanded){html+='<div class="exercise-body">';ex.sets.forEach((s,i)=>{html+=`<div class="setrow ${s.done?'completed':''}" data-setrow="${ex.id}:${i}"><span class="setnum">${i+1}.</span>${ex.unilateral?`<div><div class="side-row"><span class="side-label">L</span>${stepper(ex.id,i,'L','kg',s.L?.kg??s.kg)}${stepper(ex.id,i,'L','reps',s.L?.reps??s.reps)}</div><div class="side-row"><span class="side-label">P</span>${stepper(ex.id,i,'P','kg',s.P?.kg??'')}${stepper(ex.id,i,'P','reps',s.P?.reps??'')}</div></div>`:`${stepper(ex.id,i,'','kg',s.kg)}${stepper(ex.id,i,'','reps',s.reps)}`}<button class="donebtn ${s.done?'checked':''}" data-done="${ex.id}:${i}" aria-label="Hotová série">${s.done?'✓':'○'}</button><button class="delbtn" data-delete-set="${ex.id}:${i}" aria-label="Smazat sérii">✕</button></div>`;});html+=`<button class="addseries" data-add-set="${ex.id}">+ série</button></div>`;}html+='</article>';});const others=visiblePart(part).filter(e=>!added.some(x=>x.id===e.id));if(others.length)html+=`<div class="other-list">${others.map(e=>`<button class="exercise-chip" data-add-ex="${e.id}">＋ ${esc(e.name)}</button>`).join('')}</div>`;html+=`<div class="custom-add"><input id="custom-${slug(part)}" placeholder="Jiný cvik…" aria-label="Jiný cvik pro ${esc(part)}"><button data-custom="${esc(part)}">Přidat</button></div>`;});document.getElementById('workoutContent').innerHTML=html;document.querySelectorAll('[data-expand]').forEach(el=>el.onclick=()=>{d.expanded=d.expanded===el.dataset.expand?null:el.dataset.expand;save();renderWorkoutContent();});document.querySelectorAll('[data-add-ex]').forEach(b=>b.onclick=()=>{addExercise(b.dataset.addEx);renderWorkoutContent();});document.querySelectorAll('[data-custom]').forEach(b=>b.onclick=()=>{const inp=document.getElementById('custom-'+slug(b.dataset.custom));customExercise(b.dataset.custom,inp.value);renderWorkoutContent();});document.querySelectorAll('[data-add-set]').forEach(b=>b.onclick=()=>{const ex=d.exercises.find(x=>x.id===b.dataset.addSet);const prev=ex.sets.at(-1)||defaultSet(ex.id);ex.sets.push(JSON.parse(JSON.stringify({...prev,done:false})));save();renderWorkoutContent();});document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>toggleDone(b.dataset.done));document.querySelectorAll('[data-delete-set]').forEach(b=>b.onclick=()=>deleteSet(b.dataset.deleteSet));document.querySelectorAll('[data-val]').forEach(inp=>{inp.addEventListener('focus',()=>inp.select());inp.addEventListener('change',()=>changeValue(inp));});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>stepValue(b));}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-');}
function stepper(id,i,side,field,value){const v=value===''?'':num(value);return `<div class="stepper"><button data-step="${id}:${i}:${side}:${field}:-1">−</button><input type="number" inputmode="decimal" data-val="${id}:${i}:${side}:${field}" value="${v}" aria-label="${field==='kg'?'Kilogramy':'Opakování'}"></div>`;}
function locateSet(key){const [id,i]=key.split(':');const ex=db.draft.exercises.find(x=>x.id===id);return {ex,s:ex?.sets[Number(i)],i:Number(i)};}
function changeValue(inp){const [id,i,side,field]=inp.dataset.val.split(':');const {ex,s}=locateSet(id+':'+i);if(!s)return;const v=inp.value===''?'':Math.max(0,num(inp.value));if(ex.unilateral){s[side]=s[side]||{};s[side][field]=v;if(side==='L'&&field==='kg'){} }else{s[field]=v;if(field==='kg'){ex.sets.forEach((x,j)=>{if(j>Number(i)&&!x.done)x.kg=v;});db.settings.lastWeights[id]=v;}}if(field==='kg'&&!ex.unilateral)db.settings.lastWeights[id]=v;save();refreshSummaryOnly();}
function stepValue(b){const [id,i,side,field,delta]=b.dataset.step.split(':');const {ex,s}=locateSet(id+':'+i);if(!s)return;const target=ex.unilateral?(s[side]=s[side]||{}):s;const old=target[field]===''||target[field]===undefined?0:num(target[field]);target[field]=Math.max(0,old+Number(delta));if(field==='kg'&&!ex.unilateral){ex.sets.forEach((x,j)=>{if(j>Number(i)&&!x.done)x.kg=target[field];});db.settings.lastWeights[id]=target[field];}save();renderWorkoutContent();}
function refreshSummaryOnly(){document.querySelectorAll('.exercise-card').forEach(card=>{const head=card.querySelector('.exercise-head');const id=head?.dataset.expand;const ex=db.draft.exercises.find(x=>x.id===id);if(ex){const sm=card.querySelector('.exercise-summary');if(sm)sm.textContent=ex.sets.filter(s=>s.done).length+'/'+ex.sets.length+' sérií · '+Math.round(workoutVolume(ex)).toLocaleString('cs-CZ')+' kg';}});document.querySelectorAll('.section-head').forEach(h=>{const p=h.querySelector('h2')?.textContent;if(p)h.querySelector('.pill').textContent=Math.round(partVolume(p)).toLocaleString('cs-CZ')+' kg';});}
function toggleDone(key){const {ex,s,i}=locateSet(key);if(!s)return;s.done=!s.done;if(s.done){if(ex.unilateral){s.L=s.L||{kg:s.kg||0,reps:s.reps||10};if(!s.P||s.P.kg===''||s.P.kg===undefined)s.P={kg:s.L.kg,reps:s.L.reps};}else db.settings.lastWeights[ex.id]=s.kg;startPause();}else{stopPause();}save();renderWorkoutContent();}
function deleteSet(key){const {ex,i}=locateSet(key);if(!ex)return;ex.sets.splice(i,1);if(!ex.sets.length){db.draft.exercises=db.draft.exercises.filter(x=>x.id!==ex.id);db.draft.expanded=db.draft.exercises.at(-1)?.id||null;}save();renderWorkoutContent();}
function endWorkout(){const d=db.draft;if(!d)return;const finished=d.exercises.map(ex=>({...ex,sets:ex.sets.filter(s=>s.done).map(s=>JSON.parse(JSON.stringify(s)))})).filter(ex=>ex.sets.length);if(finished.length){db.history.push({id:d.id,day:d.day,date:d.date,started:d.started,ended:new Date().toISOString(),exercises:finished});save();toast('Trénink uložen do historie.');}else toast('Prázdný trénink nebyl uložen.');db.draft=null;save();releaseWakeLock();stopPause();renderWorkout();}
document.getElementById('endWorkout').onclick=()=>twoStep('endWorkout','Ukončit','Jistě?',endWorkout);
function twoStep(id,normal,confirm,action){const b=document.getElementById(id);if(b.dataset.armed==='1'){clearTimeout(confirmTimers[id]);b.dataset.armed='0';b.textContent=normal;action();return;}b.dataset.armed='1';b.textContent=confirm;confirmTimers[id]=setTimeout(()=>{b.dataset.armed='0';b.textContent=normal;},3000);}
function startPause(){pauseRemaining=db.settings.pause;pauseEnd=Date.now()+pauseRemaining*1000;ringing=false;document.getElementById('timerBar').classList.remove('ring');updateClocks();}
function stopPause(){pauseEnd=0;pauseRemaining=0;document.getElementById('pauseClock').textContent='—';document.getElementById('timerBar').classList.remove('ring');}
function updateClocks(){if(db.draft){const sec=Math.max(0,Math.floor((Date.now()-new Date(db.draft.started).getTime())/1000));document.getElementById('totalClock').textContent=clock(sec);}if(pauseEnd){const left=Math.max(0,Math.ceil((pauseEnd-Date.now())/1000));document.getElementById('pauseClock').textContent=clock(left);if(left===0&&!ringing){ringing=true;document.getElementById('timerBar').classList.add('ring');notifyEnd();}}}
function clock(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
setInterval(updateClocks,500);
document.getElementById('pauseToggle').onclick=()=>{if(pauseEnd){pauseRemaining=Math.max(0,Math.ceil((pauseEnd-Date.now())/1000));pauseEnd=0;document.getElementById('pauseToggle').textContent='Pokračovat';}else if(pauseRemaining){pauseEnd=Date.now()+pauseRemaining*1000;document.getElementById('pauseToggle').textContent='Pauza';}else startPause();updateClocks();};
document.getElementById('pauseMinus').onclick=()=>adjustPause(-15);document.getElementById('pausePlus').onclick=()=>adjustPause(15);
function adjustPause(n){if(pauseEnd){pauseEnd+=n*1000;if(pauseEnd<Date.now())pauseEnd=Date.now();}else pauseRemaining=Math.max(0,pauseRemaining+n);updateClocks();}
function notifyEnd(){try{if(navigator.vibrate)navigator.vibrate([120,80,120,80,180]);const C=window.AudioContext||window.webkitAudioContext;if(C){const c=new C();[0,.22,.44].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.12,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.12);o.start(c.currentTime+t);o.stop(c.currentTime+t+.13);});setTimeout(()=>c.close(),1000);}}catch(e){}}
async function acquireWakeLock(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
async function releaseWakeLock(){try{if(wakeLock)await wakeLock.release();}catch(e){}wakeLock=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&db.draft)acquireWakeLock();});
function renderProgress(){const sel=document.getElementById('progressSelect');const old=sel.value;let opts='<option value="weight">Tělesná váha</option>';PARTS.forEach(p=>{opts+=`<optgroup label="${p.name}"><option value="part:${p.name}">Celkový objem: ${p.name}</option>`+allPart(p.name).map(e=>`<option value="ex:${e.id}">${esc(e.name)}</option>`).join('')+'</optgroup>';});sel.innerHTML=opts;if(old)sel.value=old;drawProgress(sel.value||'weight');}
document.getElementById('progressSelect').onchange=e=>drawProgress(e.target.value);
function drawProgress(key){let data=[],title='',unit='';if(key==='weight'){title='Tělesná váha';unit='kg';data=db.weights.map(x=>({date:x.date,value:x.kg}));}else if(key.startsWith('part:')){const p=key.slice(5);title='Celkový objem: '+p;unit='kg';data=db.history.map(h=>({date:h.date,value:h.exercises.filter(e=>e.part===p).reduce((s,e)=>s+e.sets.reduce((a,x)=>a+x.kg*x.reps*(e.unilateral?2:1),0),0)})).filter(x=>x.value>0);}else{const id=key.slice(3),e=getExercise(id);title=e?.name||'Cvik';unit='kg';data=db.history.map(h=>{const x=h.exercises.find(z=>z.id===id);return x?{date:h.date,value:Math.max(...x.sets.map(s=>s.kg),0)}:null;}).filter(Boolean);}const out=document.getElementById('progressOutput');if(!data.length){out.innerHTML=`<div class="card empty">Pro „${esc(title)}“ zatím nejsou žádná data.</div>`;return;}const vals=data.map(x=>x.value),min=Math.min(...vals),max=Math.max(...vals),pad=(max-min||1)*.18,lo=min-pad,hi=max+pad,w=330,h=190,pts=data.map((x,i)=>({x:20+(data.length===1?145:i*(290/(data.length-1))),y:160-(x.value-lo)/(hi-lo)*125}));const path=pts.map((p,i)=>(i?'L':'M')+p.x+','+p.y).join(' ');const dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>`).join('');const maxVal=Math.max(...vals);out.innerHTML=`<div class="chartbox"><h3>${esc(title)}</h3>${key.startsWith('ex:')?`<p class="subhead">Osobní rekord: <b>${maxVal} kg</b></p>`:''}<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Čárový graf ${esc(title)}"><line x1="20" y1="160" x2="310" y2="160" stroke="var(--line)"/><line x1="20" y1="30" x2="20" y2="160" stroke="var(--line)"/><text x="20" y="18" fill="var(--muted)" font-size="10">${max} ${unit}</text><text x="20" y="178" fill="var(--muted)" font-size="10">${min} ${unit}</text><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}<text x="20" y="190" fill="var(--muted)" font-size="9">${data[0].date}</text><text x="310" y="190" text-anchor="end" fill="var(--muted)" font-size="9">${data.at(-1).date}</text></svg><div class="chart-meta"><span>Minimum: ${min} ${unit}</span><span>Maximum: ${max} ${unit}</span></div><div class="chart-meta"><span>První: ${data[0].date}</span><span>Poslední: ${data.at(-1).date}</span></div></div>`;}
function duration(h){const s=Math.max(0,Math.round((new Date(h.ended)-new Date(h.started))/1000));return Math.floor(s/60)+' min';}
function renderHistory(){const el=document.getElementById('historyList');if(!db.history.length){el.innerHTML='<div class="card empty">Zatím nemáš uložený žádný trénink.</div>';return;}el.innerHTML=[...db.history].reverse().map(h=>{const parts=[...new Set(h.exercises.map(e=>e.part))];const vols=parts.map(p=>p+' '+Math.round(h.exercises.filter(e=>e.part===p).reduce((a,e)=>a+e.sets.reduce((s,x)=>s+x.kg*x.reps*(e.unilateral?2:1),0),0)).toLocaleString('cs-CZ')+' kg').join(' · ');return `<div class="card history-item"><div class="history-head"><div><strong>${esc(h.day)}</strong><div class="muted small">${fmtDate(h.date)} · ${duration(h)}</div></div><button class="danger" id="history-${h.id}" data-del-history="${h.id}">Smazat</button></div><div class="subhead">${vols}</div>${h.exercises.map(e=>`<div class="history-ex"><b>${esc(e.name)}</b>${e.sets.map(s=>e.unilateral?`L ${s.L?.kg??s.kg}×${s.L?.reps??s.reps} / P ${s.P?.kg??s.kg}×${s.P?.reps??s.reps}`:`${s.kg}×${s.reps}`).join(' · ')}</div>`).join('')}</div>`;}).join('');document.querySelectorAll('[data-del-history]').forEach(b=>b.onclick=()=>twoStep('history-'+b.dataset.delHistory,'Smazat','Jistě?',()=>{db.history=db.history.filter(h=>h.id!==b.dataset.delHistory);save();renderHistory();}));}
function renderManager(){const el=document.getElementById('exerciseManager');el.innerHTML=PARTS.map(p=>`<div class="manage-part"><h2>${p.name}</h2>${allPart(p.name).map((e,i)=>`<div class="manage-row" data-manage="${e.id}"><input aria-label="Název cviku" value="${esc(e.name)}" data-rename="${e.id}" ${e.hidden?'disabled':''}><button data-move="${e.id}:-1" ${i===0?'disabled':''}>▲</button><button data-move="${e.id}:1" ${i===allPart(p.name).length-1?'disabled':''}>▼</button><button data-save-name="${e.id}" aria-label="Uložit název">✎</button><button class="danger" id="hide-${e.id}" data-hide="${e.id}" ${e.hidden?'disabled':''}>✕</button></div>${e.hidden?'<div class="small muted">Skrytý cvik – záznamy zůstávají v historii.</div>':''}`).join('')}<div class="custom-add"><input id="manager-new-${slug(p.name)}" placeholder="Nový cvik…"><button data-manager-add="${p.name}">Přidat</button></div></div>`).join('');el.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const [id,dir]=b.dataset.move.split(':');const e=getExercise(id),list=allPart(e.part),i=list.findIndex(x=>x.id===id),j=i+Number(dir);if(j<0||j>=list.length)return;[list[i].order,list[j].order]=[list[j].order,list[i].order];save();renderManager();});el.querySelectorAll('[data-save-name]').forEach(b=>b.onclick=()=>{const e=getExercise(b.dataset.saveName),v=el.querySelector(`[data-rename="${e.id}"]`).value.trim();if(v){e.name=v;save();renderManager();toast('Název cviku uložen.');}});el.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>twoStep('hide-'+b.dataset.hide,'Skrýt','Jistě?',()=>{getExercise(b.dataset.hide).hidden=true;save();renderManager();}));el.querySelectorAll('[data-manager-add]').forEach(b=>b.onclick=()=>{const p=b.dataset.managerAdd,inp=document.getElementById('manager-new-'+slug(p));if(!inp.value.trim())return;db.exercises.push({id:uid(),part:p,name:inp.value.trim(),order:allPart(p).length,hidden:false,unilateral:false});save();renderManager();});}
document.getElementById('exportBtn').onclick=async()=>{const textData=JSON.stringify(db,null,2);document.getElementById('backupText').value=textData;try{await navigator.clipboard.writeText(textData);toast('Záloha zkopírována do schránky.');}catch(e){toast('Záloha je připravena v textovém poli.');}};
document.getElementById('importBtn').onclick=()=>{const area=document.getElementById('backupText');try{const x=JSON.parse(area.value);if(!x||x.version!==1||!Array.isArray(x.exercises)||!Array.isArray(x.history)||!x.settings)throw Error('Neplatná struktura');if(!x.exercises.every(e=>e.id&&e.name&&e.part)||!x.history.every(h=>h.id&&Array.isArray(h.exercises)))throw Error('Neplatná data');db=x;save();renderHome();renderWorkout();toast('Záloha byla úspěšně načtena.');}catch(e){toast('Import se nezdařil: neplatná nebo poškozená záloha.');}};
function init(){renderHome();if(db.draft){acquireWakeLock();renderWorkout();}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}
init();
</script>
</body>
